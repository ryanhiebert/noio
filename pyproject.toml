[project]
name = "noio"
version = "0.1"
description = "Experimental coroutine libraries for ordinary-function applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "aiologic>=0.17.1",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "basedpyright>=1.40.2",
    "gevent>=26.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
    "trio>=0.34.0",
]

[tool.pytest.ini_options]
timeout = 30
norecursedirs = ["site"]

[tool.coverage.run]
branch = true
source = ["noio"]

[tool.ruff]
target-version = "py315"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
