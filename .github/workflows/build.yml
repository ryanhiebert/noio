name: Build

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.15", "3.15t"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Set up Python
        run: uv python install "${{ matrix.python }}"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Check formatting
        run: uv run ruff format --check
      - name: Run ruff linting
        run: uv run ruff check
      - name: Run basedpyright
        run: uv run basedpyright
      - name: Verify free threading
        if: matrix.python == '3.15t'
        run: uv run python -c "import noio, sys; assert not sys._is_gil_enabled()"
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing
        timeout-minutes: 2
      - name: Verify built package
        run: |
          uv build
          uv run --isolated --no-project --with dist/noio-*.whl python -I -c "import noio"
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == version, "Release tag must match package version"
          PY
      - name: Upload distributions
        if: github.event_name == 'release' && matrix.python == '3.15'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
